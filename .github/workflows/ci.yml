name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic python-dotenv fastapi httpx sqlalchemy "python-jose[cryptography]" itsdangerous uvicorn pytest anthropic
      - name: Pytest
        working-directory: api
        env:
          PYTHONPATH: src
          INTERVIEWOS_AUTH_BYPASS: "1"
        run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic python-dotenv fastapi httpx sqlalchemy "python-jose[cryptography]" itsdangerous uvicorn pytest anthropic
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Playwright
        working-directory: web
        env:
          CI: "1"
          INTERVIEWOS_AUTH_BYPASS: "1"
        run: npx playwright test
